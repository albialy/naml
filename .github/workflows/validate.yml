name: Validate Naml
on:
  push:
    branches: [feat/simulation-foundation-01]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: naml
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: naml_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U naml -d naml_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NAML_TEST_POSTGRES_URL: postgresql://naml:test-only@localhost:5432/naml_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: python -m pip install -r agent_system/requirements-dev.txt
      - run: python -m compileall -q agent_system
      - run: python -m pytest -q
